[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# CyberOS's own signed packages. Build and publish them with tools/release.sh,
# then point Server at wherever you uploaded dist/cyberos-repo/ and uncomment.
#
# SigLevel is Required deliberately: this repo installs packages as root, so an
# unsigned one lets whoever answers that hostname own every lab machine. The ISO
# trusts the department key automatically when
# /usr/share/pacman/keyrings/cyberos.gpg is shipped.
#[cyberos]
#SigLevel = Required DatabaseRequired
#Server = https://REPLACE-ME.example/cyberos/$arch
